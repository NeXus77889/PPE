<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Sincronía Digital</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">

  <style>
    .hidden { display: none !important; }
    .admin-card {
      background: #1e293b;
      color: #fff;
      padding: 30px;
      border-radius: 12px;
      max-width: 900px;
      margin: 30px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .auth-card { max-width: 420px; text-align: center; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #fff; }
    .data-table th, .data-table td { padding: 12px; border-bottom: 1px solid #334155; text-align: left; }
    .data-table th { background: #0f172a; }
  </style>
</head>
<body style="background-color: #0f172a; font-family: 'Poppins', sans-serif;">

  <header class="navbar-wrapper">
    <nav class="navbar" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: #1e293b; color: white;">
      <div class="brand" style="font-weight: 700; font-size: 1.2rem;">
        <i class="fa-solid fa-user-shield"></i> Panel Admin - PPE Robótica
      </div>
      <div>
        <button id="btn-logout" class="hidden" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
      </div>
    </nav>
  </header>

  <main class="main-container">

    <!-- SECCIÓN 1: LOGIN -->
    <section id="admin-login-sec">
      <div class="admin-card auth-card">
        <i class="fa-solid fa-lock" style="font-size: 3rem; color: #6366f1;"></i>
        <h2 style="margin-top: 15px;">Acceso Administrativo</h2>
        <p style="color: #94a3b8; font-size: 0.9rem;">Ingresa la contraseña para consultar las encuestas.</p>
        
        <div style="margin-top: 20px;">
          <input type="password" id="admin-pass" placeholder="Contraseña Admin" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center;">
        </div>
        
        <button id="btn-login" style="width: 100%; padding: 12px; margin-top: 15px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-key"></i> Iniciar Sesión
        </button>
        
        <p id="login-error" class="hidden" style="color: #f87171; margin-top: 15px;">Contraseña incorrecta.</p>
      </div>
    </section>

    <!-- SECCIÓN 2: DASHBOARD -->
    <section id="admin-dashboard-sec" class="hidden">
      <div class="admin-card">
        <h2><i class="fa-solid fa-chart-pie"></i> Muestras Registradas: <span id="total-count" style="color: #6366f1;">0</span></h2>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px;">
          <div style="background: #0f172a; padding: 15px; border-radius: 8px; height: 260px;">
            <h4 style="margin-bottom: 10px;">Horas de Uso Diario</h4>
            <canvas id="chart-hours"></canvas>
          </div>
          <div style="background: #0f172a; padding: 15px; border-radius: 8px; height: 260px;">
            <h4 style="margin-bottom: 10px;">Influencia en Ánimo (P7)</h4>
            <canvas id="chart-mood"></canvas>
          </div>
        </div>

        <h3 style="margin-top: 35px;"><i class="fa-solid fa-table"></i> Registros de la Base de Datos</h3>
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Edad</th>
                <th>Horas/Día</th>
                <th>Dormir (P3)</th>
                <th>Dejarlo (P4)</th>
                <th>Ánimo (P7)</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="admin-table-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
